[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fb2cal"
version = "1.3.2"
description = "Fetch Facebook birthdays and export calendar/contact files"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{ name = "Mo Beigi", email = "me@mobeigi.com" }]
keywords = ["facebook", "birthday", "calendar", "export", "ics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Other Audience",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
urls = { Homepage = "https://github.com/mobeigi/fb2cal", Repository = "https://github.com/mobeigi/fb2cal" }
dependencies = [
  "MechanicalSoup>=1.3.0",
  "ics>=0.7.2",
  "requests>=2.31.0",
  "pycryptodomex>=3.20.0",
  "PyNaCl>=1.5.0",
]

[project.scripts]
fb2cal = "fb2cal.__main__:main"

[dependency-groups]
dev = [
  "freezegun>=1.5.0",
  "pytest>=8.0.0",
  "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
